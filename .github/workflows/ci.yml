name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.x'
  NODE_VERSION: '24'

jobs:
  # 结构与单元测试门禁。E2E 不在本 workflow 运行：Playwright/CDP 需要
  # Windows + 系统 Chrome（或 headless Chrome CDP），Ubuntu 容器无法覆盖；
  # 未执行的 E2E 不算通过，真实结果见 frontend/e2e/report/。
  quality:
    name: linux / frontend + backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Frontend checks
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm check:sdd
          pnpm check:trace

      - name: Build web assets for embed
        shell: bash
        run: |
          cd frontend
          pnpm build
          mkdir -p ../backend/internal/webui/dist
          cp -R dist/. ../backend/internal/webui/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # backend/go.mod 声明 go 1.27；1.24 无法构建本仓库，按实际版本锁定。
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        shell: bash
        run: |
          cd backend
          # Linux runners have no Chrome/PowerShell and lack Office Python
          # packages; those host capabilities are covered by the Windows job.
          go test ./... -skip '^(TestM12PDFGenerationApprovalAndPreview|TestM12DocxAndXlsxHelpers|TestM9PwshApprovalAndExitCode|TestM9PwshEnvTimeoutAndSpill)$'

  build-test:
    name: windows / go + web + mock evals + package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install web dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile

      - name: Install Office Python helpers
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check python-docx openpyxl python-pptx

      # One command runs: preflight -> web build -> go vet/test -> build exe
      # -> mock evals (4 blocks, fresh server + GUID home per block) -> package -> docker (SKIP when absent)
      - name: Pipeline (deploy/ci.ps1)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\ci.ps1

      - name: Upload portable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simo-portable-package
          path: |
            deploy/dist/*.zip
            deploy/dist/*.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .tmp/ci-*
          if-no-files-found: warn
          retention-days: 14

  # Optional: real-model smoke. Enable per repository with variable RUN_REAL_SMOKE=true
  # and secret DEEPSEEK_API_KEY. Never hardcode keys in the workflow file.
  real-smoke:
    name: optional real-model smoke
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_REAL_SMOKE == 'true' }}
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: simo-portable-package
          path: dist

      - name: Extract package
        shell: pwsh
        run: Expand-Archive -Path dist/*win-x64.zip -DestinationPath .tmp\pkg -Force

      - name: Real smoke (token budget 45000)
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SIMO_CONFIG: ${{ github.workspace }}/backend/config.local.json
        run: |
          if (-not $env:DEEPSEEK_API_KEY) { Write-Host 'DEEPSEEK_API_KEY not configured; skipping'; exit 0 }
          # config.local.json is generated at runtime from the secret; never committed.
          $cfg = Get-Content backend\config.local.json -Raw | ConvertFrom-Json
          $cfg.apiKey = $env:DEEPSEEK_API_KEY
          $cfg | ConvertTo-Json -Depth 6 | Set-Content backend\config.local.json -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File evals\real-smoke.ps1 -Exe .tmp\pkg\simo.exe -Port 18903 -TokenBudget 45000

  # Optional: container build. Enable per repository with variable RUN_DOCKER=true.
  docker:
    name: optional docker build
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (main Dockerfile)
        run: docker build -f deploy/Dockerfile -t simo:ci .

      - name: Build image (go-only fallback)
        run: docker build -f deploy/Dockerfile.go-only -t simo:ci-goonly .
