# 变异抽查：verify-all 按顺序取前 3 条，改坏实现后跑指定测试，测试不变红即整轮失败。
mutations:
  - id: MUT-001
    featureId: PRD-TASK-001
    target: frontend/src/components/tasks.tsx
    find: "all: '全部'"
    replace: "all: '所有'"
    layer: frontend
    test: src/components/TaskPanel.test.tsx
  - id: MUT-002
    featureId: PRD-TASK-003
    target: backend/internal/modules/tasks/conv_http.go
    find: 'newConvError(400, "invalid_task_limit", "limit 必须在 1..100")'
    replace: 'newConvError(400, "invalid_limit", "limit 必须在 1..100")'
    layer: backend
    test: ./internal/modules/tasks -run TestConvHTTPErrorEnvelopes -count=1
  - id: MUT-003
    featureId: PRD-TASK-001
    target: frontend/src/components/library.tsx
    find: '还有 {moreTasks} 个'
    replace: '还有 {moreTasks} 条'
    layer: frontend
    test: src/components/RightPanel.test.tsx
